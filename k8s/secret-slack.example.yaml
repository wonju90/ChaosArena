# 사용법:
#   1) 이 파일을 secret-slack.yaml로 복사
#   2) url 값을 실제 Slack Webhook URL로 교체
#   3) kubectl apply -f k8s/secret-slack.yaml
# secret-slack.yaml은 .gitignore에 등록되어 있어 실수로 커밋되지 않는다. (Slack 알림 없이도
# 앱은 정상 동작하므로, 이 secret 자체를 생략해도 된다 - deployment.yaml에서 optional: true)
apiVersion: v1
kind: Secret
metadata:
  name: slack-webhook
  namespace: default
type: Opaque
stringData:
  url: "https://hooks.slack.com/services/REPLACE/ME/WITH-REAL-WEBHOOK"
