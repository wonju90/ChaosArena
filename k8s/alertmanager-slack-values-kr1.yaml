# ---------------------------------------------------------------------------
# k8s/alertmanager-slack-values.yaml(KR2)의 KR1 전용 사본. 컨트롤 플레인 이중화(각 리전이
# 독립된 Jenkins/ArgoCD/모니터링 스택을 갖게 됨, docs/PROJECT_LOG.md 참고)의 일환으로 KR1에도
# kube-prometheus-stack을 새로 설치하면서 함께 만든다.
#
# 새 Slack 채널/웹훅을 따로 만들지 않고 KR2와 같은 slack-webhook Secret(같은 URL)을 재사용한다 —
# 대신 제목 접두어(title)로 어느 리전의 알림인지만 구분한다. 채널을 완전히 분리하고 싶으면 나중에
# 별도 Incoming Webhook을 만들어 이 파일의 api_url_file 대상 Secret만 바꾸면 된다.
#
# 적용 방법(KR2와 동일한 함정 — --reuse-values 쓰지 말 것, PROJECT_LOG.md 4.12절):
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --set grafana.service.type=NodePort --set grafana.service.nodePort=30030 \
#     --set prometheus.service.type=NodePort --set prometheus.service.nodePorts.http=30090 \
#     -f k8s/alertmanager-slack-values-kr1.yaml
# ---------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-webhook

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            channel: "#chaosarena-전체"
            send_resolved: true
            # 한글화 방식은 k8s/alertmanager-slack-values.yaml(KR2) 주석 참고 — 실제로 확인된
            # 기본 알림만 번역하고, 모르는 alertname은 원문 그대로 통과시킨다.
            title: "[KR1] {{ if eq .CommonLabels.alertname \"InfoInhibitor\" }}ℹ️ 정보성 알림 억제 중{{ else if eq .CommonLabels.alertname \"etcdInsufficientMembers\" }}⚠️ etcd 멤버 수 부족{{ else }}{{ .CommonLabels.alertname }}{{ end }}"
            text: "{{ if eq .CommonLabels.alertname \"InfoInhibitor\" }}info 등급 알림이 하나 이상 억제(inhibit)되고 있어요 - 더 심각한 알림이 이미 울리고 있다는 뜻이니 그 알림부터 확인하세요.{{ else if eq .CommonLabels.alertname \"etcdInsufficientMembers\" }}etcd 클러스터 멤버 수가 기준보다 적어요. 이 클러스터는 마스터 1대짜리 단일 노드 etcd라 원래 상시 발생하는 알림이고(HA 구성이 아님), 실제 장애 신호는 아니에요.{{ else }}{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}{{ end }}"
