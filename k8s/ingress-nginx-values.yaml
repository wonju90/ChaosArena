# ingress-nginx Controller (KR2 전용, 1단계 병렬 테스트).
# MetalLB L2 모드가 이 클라우드 네트워크에서 막힐 수 있어(k8s/service-loadbalancer.yaml 주석 참고)
# LoadBalancer 대신 NodePort로 노출한다. 30080(앱)/30880(Jenkins)/30030,30090,30760(모니터링)과
# 안 겹치는 포트로 고정 지정 — 고정 안 하면 매 설치마다 랜덤 포트가 배정돼 재현이 안 된다.
controller:
  service:
    type: NodePort
    nodePorts:
      http: 30081
      https: 30444
