<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}K8s 장애 대응 게임 대시보드{% endblock %}</title>
<style>
  * { box-sizing: border-box; }

  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.08), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.07), transparent 45%),
      #0f172a;
    color: #e2e8f0;
    font-family: "Pretendard", "Malgun Gothic", sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 20px;
  }

  .panel {
    background: linear-gradient(165deg, #1e293b 0%, #17233a 100%);
    border: 1px solid rgba(148, 163, 184, 0.08);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 16px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    animation: panel-in 0.35s ease-out both;
  }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .panel h2 {
    margin: 0 0 12px 0;
    font-size: 15px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* 재사용 stat-tile: 아이콘 + 큰 숫자 + 라벨 카드 */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .stat-tile {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 12px;
    padding: 14px 16px;
    transition: transform 0.15s, border-color 0.15s;
  }
  .stat-tile:hover { transform: translateY(-2px); border-color: rgba(148, 163, 184, 0.3); }
  .stat-tile .stat-icon { font-size: 20px; margin-bottom: 6px; }
  .stat-tile .stat-value { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .stat-tile .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  .stat-accent-blue .stat-value { color: #60a5fa; }
  .stat-accent-green .stat-value { color: #4ade80; }
  .stat-accent-orange .stat-value { color: #fb923c; }
  .stat-accent-red .stat-value { color: #f87171; }
  .stat-accent-gold .stat-value { color: #facc15; }

  .pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
  }

  /* 상단 네비게이션 (페이지 3개: 게임 / 대시보드 / 기록) */
  .top-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .nav-links {
    display: flex;
    gap: 6px;
    background: rgba(15, 23, 42, 0.5);
    padding: 5px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.1);
  }
  .nav-links a {
    padding: 8px 16px;
    border-radius: 8px;
    background: transparent;
    color: #94a3b8;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.15s, color 0.15s, transform 0.15s;
    display: inline-block;
  }
  .nav-links a:hover { background: #334155; color: #f1f5f9; }
  .nav-links a.active {
    background: linear-gradient(135deg, #334155, #475569);
    color: #f8fafc;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .nav-badges { display: flex; gap: 8px; align-items: center; }
  #local-mode-badge {
    font-size: 13px;
    background: #713f12;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fde68a;
    display: none; /* LOCAL_MODE일 때만 JS로 보여줌 */
  }
  #version-badge {
    font-size: 13px;
    background: #334155;
    padding: 4px 10px;
    border-radius: 999px;
    color: #cbd5e1;
  }

  /* 다른 페이지에 있어도 미션 진행 상황을 놓치지 않도록 하는 네비게이션 배지 */
  #mission-nav-badge {
    font-size: 13px;
    font-weight: 600;
    background: rgba(124, 45, 18, 0.5);
    padding: 4px 10px;
    border-radius: 999px;
    color: #fdba74;
    display: none;
    animation: mission-badge-pulse 1.4s ease-in-out infinite;
  }
  @keyframes mission-badge-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* 좁은 화면(모바일) 대응 */
  @media (max-width: 560px) {
    body { padding: 14px; }
    .top-nav { flex-direction: column; align-items: stretch; }
    .nav-links { justify-content: center; }
    .nav-badges { justify-content: center; flex-wrap: wrap; }
    .stat-grid { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
    .stat-tile .stat-value { font-size: 22px; }
  }

  {% block extra_style %}{% endblock %}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-links">
    <a href="/" class="{{ 'active' if active_page == 'game' else '' }}">🎮 게임</a>
    <a href="/monitor" class="{{ 'active' if active_page == 'monitor' else '' }}">📊 대시보드</a>
    <a href="/records" class="{{ 'active' if active_page == 'records' else '' }}">🏆 기록</a>
  </div>
  <div class="nav-badges">
    <span id="mission-nav-badge"></span>
    <span id="local-mode-badge">🧪 로컬 모드 (가짜 데이터)</span>
    <span id="version-badge">배포 버전: {{ version }}</span>
  </div>
</nav>

{% block content %}{% endblock %}

<script>
// LOCAL_MODE 여부는 배포 중 바뀌지 않으므로 페이지 로드 시 한 번만 확인한다.
(async function showLocalModeBadgeIfNeeded() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    if (data.local_mode) {
      document.getElementById('local-mode-badge').style.display = 'inline-block';
    }
  } catch (e) {
    // 배지 표시는 부가 정보라 실패해도 페이지 동작에는 영향 없음
  }
})();

// 미션 진행 상황 배지: 게임 페이지가 아니어도 복구 중인지 알 수 있게 1초마다 확인한다.
// (완료 판정/기록 갱신은 하지 않는 조회 전용 엔드포인트라 게임 페이지의 랭크 연출과 충돌하지 않는다)
async function refreshMissionNavBadge() {
  try {
    const res = await fetch('/api/mission/peek');
    const data = await res.json();
    const badge = document.getElementById('mission-nav-badge');
    if (data.active) {
      badge.style.display = 'inline-block';
      badge.innerText = `🎯 복구 중... ${data.elapsed.toFixed(1)}초`;
    } else {
      badge.style.display = 'none';
    }
  } catch (e) {
    // 배지 표시는 부가 정보라 실패해도 페이지 동작에는 영향 없음
  }
}
setInterval(refreshMissionNavBadge, 1000);
refreshMissionNavBadge();
</script>
{% block extra_script %}{% endblock %}
</body>
</html>
