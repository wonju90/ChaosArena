# -----------------------------------------------------------------------------
# KR2 클러스터엔 StorageClass(자동 디스크 프로비저닝)가 없다(bare-metal kubeadm, CSI 드라이버 미설치).
# 그래서 워커 노드 1대(chaosarena-worker1-kr2)의 로컬 디렉터리(/data/jenkins)를 hostPath로
# 직접 지정하는 수동 PV를 만든다. Jenkins 컨트롤러는 단일 인스턴스라 특정 노드에 고정해도 무방하다.
#
# 주의: hostPath는 그 노드의 로컬 디스크만 가리키므로, Jenkins 컨트롤러 파드도
# nodeSelector(kubernetes.io/hostname: chaosarena-worker1-kr2)로 반드시 같은 노드에 고정해야 한다.
# (k8s/jenkins-values.yaml의 controller.nodeSelector 참고)
#
# 사전 준비 (완료): chaosarena-worker1-kr2에 `sudo mkdir -p /data/jenkins && chown 1000:1000 /data/jenkins`
# (1000은 Jenkins 공식 Helm 차트 컨테이너의 기본 실행 UID)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-pv
spec:
  capacity:
    storage: 8Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: jenkins-local
  hostPath:
    path: /data/jenkins
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - chaosarena-worker1-kr2
