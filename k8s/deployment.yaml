# ---------------------------------------------------------------------------
# chaos-demo 워크로드 Deployment.
# app.py의 LABEL_SELECTOR("app=chaos-demo")와 EXPECTED_REPLICAS(기본 3)에 맞춰
# label/replicas를 구성했다. serviceAccountName은 rbac.yaml에서 만든 것과 짝을 이룬다.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-demo
  namespace: default
  labels:
    app: chaos-demo
spec:
  replicas: 3
  # replica 수(3)가 워커 노드 수(3)와 같고 podAntiAffinity로 노드당 1개만 허용하므로,
  # 기본 롤링업데이트(새 파드를 먼저 띄움)는 4번째 파드가 올라갈 노드가 없어 교착된다.
  # maxSurge=0으로 "기존 파드를 먼저 비우고 새 파드를 그 노드에 배치"하도록 한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: chaos-demo
  template:
    metadata:
      labels:
        app: chaos-demo
    spec:
      serviceAccountName: chaos-dashboard-sa
      # NCR(비공개 레지스트리)에서 이미지를 받아오므로 인증이 필요하다.
      # ncr-secret은 마스터 노드에서 kubectl create secret docker-registry로 미리 생성해둔다.
      imagePullSecrets:
        - name: ncr-secret
      # 워커 노드가 정확히 3대라, replicas=3일 땐 노드당 1개씩 퍼지는 걸 "선호"한다.
      # HPA 도입 전엔 required(강제)였는데, 그러면 HPA가 4개 이상으로 늘리려 할 때
      # 노드 3대에 이미 파드가 하나씩 있어서 4번째가 영원히 Pending으로 막혀버린다.
      # preferred로 완화해서, 평소엔 그대로 노드당 1개로 퍼지되 HPA가 늘릴 때만
      # 한 노드에 여러 개가 뜨는 걸 허용한다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: chaos-demo
                topologyKey: kubernetes.io/hostname
      containers:
        # 주의: Jenkins가 배포 때마다 `kubectl set image`로 이 필드를 직접 덮어쓴다(태그는
        # jenkins-${BUILD_NUMBER}). 그래서 이 파일의 태그는 곧 최신 배포보다 뒤처지게 되고,
        # 다른 필드(affinity 등)만 고치려고 이 파일을 그대로 apply하면 이미지가 여기 적힌
        # 옛날 태그로 조용히 롤백된다 — HPA 작업 때 실제로 겪은 실수. 이 파일을 손으로 apply하기
        # 전엔 항상 `kubectl get deployment chaos-demo -o jsonpath='{.spec.template.spec.containers[0].image}'`
        # 로 현재 실제 태그를 먼저 확인해서 맞춰두거나, apply 직후 `kubectl set image`로 복구할 것.
        - name: chaos-demo
          image: "55901daa-kr1-registry.container.nhncloud.com/chaosarena-registry/chaos-arena:jenkins-12" # NCR(비공개 레지스트리)
          # 기본값(IfNotPresent)은 태그가 같으면 로컬 캐시를 그대로 써버려서, 태그를 안 바꾸고
          # 재빌드/재서명해도 노드가 새 이미지를 못 본다. 매번 레지스트리에서 실제로 확인하게 강제.
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: LOCAL_MODE
              value: "false"
            - name: K8S_NAMESPACE
              value: "default"
            - name: EXPECTED_REPLICAS
              value: "3"
            - name: APP_VERSION
              # 클러스터마다 다르게 채워서 대시보드 배지로 어느 클러스터가 응답 중인지 구분.
              # 현재 평촌 단독이므로 kr2. 멀티클러스터 확장 시 KR1은 kr1 등으로.
              value: "kr2"
            - name: PROMETHEUS_URL
              # kube-prometheus-stack Helm 릴리즈가 monitoring 네임스페이스에 만든 Service.
              # KR1 같은 최소 스펙 클러스터(모니터링 스택 미설치)에는 이 env를 넣지 않는다 —
              # app.py가 빈 값이면 자동으로 "미연동" 상태로 우아하게 처리한다.
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: slack-webhook
                  key: url
                  optional: true # secret이 없어도 파드가 정상적으로 뜨도록
            # ArgoCD 도입 전엔 Jenkins가 배포 직후 `kubectl set env`로 즉석에서 넣어줬던 값들이라
            # 이 파일엔 원래 없었다. GitOps에서는 "클러스터의 실제 상태 = Git의 내용"이어야 하므로
            # (그래야 ArgoCD self-heal이 이 값들을 안 지운다), 이제 여기 선언해두고 Jenkins가
            # ChaosArena-manifests 레포의 사본에 yq로 값을 갱신해서 커밋한다.
            - name: BUILD_NUMBER
              value: ""
            - name: GIT_COMMIT
              value: ""
            - name: DEPLOY_DURATION_SECONDS
              value: ""
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              # CPU 부하 버튼이 실제로 컨테이너 CPU를 태우기 때문에 limit이 꼭 필요하다.
              # (없으면 부하 데모가 워커 노드 전체 성능에 영향을 줄 수 있다)
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
