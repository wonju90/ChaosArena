# ---------------------------------------------------------------------------
# kube-prometheus-stack이 설치하는 Prometheus Operator의 CRD.
# "Service(chaos-demo-nodeport)를 찾아서, 그 Service가 가리키는 파드들의 /metrics를
# 주기적으로 긁어와라"는 지시서. kube-prometheus-stack 설치 후에만 이 CRD가 존재한다.
#
# 적용 방법: kubectl apply -f k8s/servicemonitor.yaml
# (monitoring 네임스페이스가 아니라 앱과 같은 default에 둬도 된다 — namespaceSelector는
#  기본값이 전체 네임스페이스라 문제없음)
#
# 주의: kube-prometheus-stack은 serviceMonitorSelectorNilUsesHelmValues=true가 기본값이라,
# Prometheus CR의 serviceMonitorSelector: {} 설정을 무시하고 실제로는
# "release: <helm 릴리즈 이름>" 라벨이 붙은 ServiceMonitor만 선택한다. 그래서 아래
# release 라벨이 반드시 필요하다 (helm install 시 릴리즈 이름을 다르게 했다면 그 값으로 변경).
# ---------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chaos-demo
  namespace: default
  labels:
    app: chaos-demo
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: chaos-demo
  endpoints:
    - port: http       # service-nodeport.yaml의 ports[].name과 일치해야 함
      path: /metrics
      interval: 15s
