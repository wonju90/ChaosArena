# ArgoCD Application — 이 리소스 자체는 클러스터에 뜬 ArgoCD에게 "이 Git 저장소의 이 경로를
# 지켜보다가, 바뀌면 이 클러스터/네임스페이스에 반영해라"고 알려주는 선언이다.
# 실제로 반영되는 앱 매니페스트(deployment.yaml 등)는 이 레포가 아니라 ChaosArena-manifests
# 레포의 argocd-managed/ 폴더에 있다 — 그 레포가 "GitOps의 source of truth"다.
#
# 적용 방법: kubectl apply -f k8s/argocd-application.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/wonju90/ChaosArena-manifests.git
    targetRevision: main
    path: argocd-managed-kr2   # KR1도 자기 몫(argocd-managed-kr1)을 갖게 되면서 리전별로 개명함

  destination:
    # ArgoCD가 설치된 클러스터 자기 자신(KR2)을 가리키는 특수 값 — 별도 kubeconfig 등록 불필요.
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    # 이 프로젝트의 다른 자동화(Jenkins push 트리거, HPA, GSLB failover)와 같은 기조 —
    # 사람이 "동기화" 버튼을 누를 필요 없이 Git 변경이 곧바로 클러스터에 반영되게 한다.
    automated:
      prune: true # Git에서 리소스가 삭제되면 클러스터에서도 삭제
      selfHeal: true # 누가 kubectl로 클러스터를 직접 바꿔도 Git 상태로 자동 되돌림
    syncOptions:
      - CreateNamespace=false # default 네임스페이스는 이미 존재
