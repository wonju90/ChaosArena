# ingress-nginx Controller (KR2 전용).
# 1단계(병렬 테스트)에선 30081/30444라는 별도 포트로 띄워서 라우팅만 검증했고, 2단계에서 실제 입구로
# 전환하면서 http를 30080(원래 chaos-demo-nodeport가 쓰던 포트)으로 옮겼다. 포트 번호를 그대로
# 재사용했기 때문에 GSLB Pool의 헬스체크(IP:30080 고정)는 전혀 안 건드려도 된다.
# https는 아직 TLS 인증서가 없어서 당장 쓰이진 않지만, 나중에 TLS 붙일 때 그대로 쓸 수 있게 유지.
controller:
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30444
