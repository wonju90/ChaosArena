# -----------------------------------------------------------------------------
# jenkinsci/jenkins 공식 Helm 차트 values.
# 적용: helm upgrade --install jenkins jenkins/jenkins -n jenkins -f k8s/jenkins-values.yaml
#
# 이 클러스터(KR2)의 제약에 맞춘 핵심 설정:
# - persistence: k8s/jenkins-pv.yaml로 미리 만들어둔 hostPath PV(storageClassName: jenkins-local)에
#   정적으로 바인딩되도록 storageClass를 맞춤.
# - nodeSelector: hostPath PV가 chaosarena-worker1-kr2의 로컬 디스크를 가리키므로,
#   컨트롤러 파드도 반드시 같은 노드에 뜨도록 고정(안 그러면 PV를 못 찾음).
# - serviceType: NodePort — MetalLB 없이 워커 공인IP:포트로 바로 접속(기존 chaos-demo와 동일 패턴).
# - installPlugins: GitHub Webhook 트리거 + Kubernetes 에이전트 파드 스폰에 필요한 플러그인 명시.
# - JCasC.configScripts: Jenkinsfile이 "지금 어느 리전에서 도는 파이프라인인지"를 구분하는
#   유일한 값(env.REGION)을 여기서 전역 환경변수로 등록한다. KR1에도 같은 Jenkinsfile을 그대로
#   쓰는 독립된 Jenkins를 하나 더 두면서(컨트롤 플레인 이중화, docs/PROJECT_LOG.md 참고),
#   매니페스트 레포 경로(argocd-managed-${REGION})와 이미지 태그 접두어(${REGION}-jenkins-N)를
#   이 값 하나로 분기한다.
#   ⚠️ containerEnv가 아니라 이 방식이어야 하는 이유: containerEnv는 컨트롤러 "컨테이너의 OS
#   환경변수"만 설정할 뿐이라 Pipeline 스크립트의 env.REGION으로는 안 들어온다(실제로 겪은 실수 —
#   null-jenkins-N으로 찍힘). JCasC의 globalNodeProperties가 Jenkins "Manage Jenkins → 전역
#   환경변수"와 동일한 정식 통로라 env.REGION에 실제로 반영된다.
# -----------------------------------------------------------------------------
controller:
  serviceType: NodePort
  nodePort: 30880
  nodeSelector:
    kubernetes.io/hostname: chaosarena-worker1-kr2
  JCasC:
    configScripts:
      region-env: |
        jenkins:
          globalNodeProperties:
            - envVars:
                env:
                  - key: "REGION"
                    value: "kr2"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - github
    - github-branch-source
    - configuration-as-code
    - credentials-binding

persistence:
  enabled: true
  storageClass: jenkins-local
  size: 8Gi

agent:
  enabled: true
