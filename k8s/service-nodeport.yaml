# 원래는 MetalLB 폴백용 NodePort였는데, 이제 ingress-nginx가 30080을 대신 물고 앞단에서
# 라우팅한다(k8s/ingress-nginx-values.yaml, k8s/chaos-demo-ingress.yaml 참고). 이 Service는
# ClusterIP로 남겨두고 Ingress가 이름으로 그대로 참조한다 — GSLB Pool 헬스체크는 포트 번호(30080)를
# 그대로 유지하는 ingress-nginx 쪽을 찌르게 되므로 GSLB 설정은 전혀 안 건드려도 된다.
apiVersion: v1
kind: Service
metadata:
  name: chaos-demo-nodeport
  namespace: default
  # Prometheus ServiceMonitor가 이 Service를 찾을 때 쓰는 라벨 (k8s/servicemonitor.yaml 참고)
  labels:
    app: chaos-demo
spec:
  type: ClusterIP
  selector:
    app: chaos-demo
  ports:
    # ServiceMonitor는 포트를 번호가 아니라 이름으로 참조하므로 name이 필요하다.
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
