# ingress-nginx Controller — KR1/KR2 공통 values. 클러스터마다 다른 값(마스터 노드 이름)은
# helm 명령의 --set으로 덧붙인다(terraform의 클러스터별 변수처럼, 파일은 공통으로 재사용).
#
# 1단계(병렬 테스트)에선 30081/30444라는 별도 포트로 띄워서 라우팅만 검증했고, 2단계에서 실제 입구로
# 전환하면서 http를 30080(원래 chaos-demo-nodeport가 쓰던 포트)으로 옮겼다. 포트 번호를 그대로
# 재사용했기 때문에 GSLB Pool의 헬스체크(IP:30080 고정)는 전혀 안 건드려도 된다.
# https는 아직 TLS 인증서가 없어서 당장 쓰이진 않지만, 나중에 TLS 붙일 때 그대로 쓸 수 있게 유지.
#
# 3단계: 포트 번호 없는 URL(http://www.chaosarena.cloud)을 쓰려면 진짜 80번 포트가 필요한데, k8s의
# NodePort는 30000-32767 범위만 쓸 수 있어서 이 방법으로는 절대 안 된다. hostPort로 노드의 실제 80번에
# 직접 바인딩하는데, 워커는 공인IP가 없고(비용 절감을 위해 일부러 안 붙임) 마스터만 있어서, 이 파드를
# 일부러 마스터 노드에 스케줄링한다(Jenkins를 hostPath PV 때문에 특정 워커에 고정했던 것과 같은 이유 —
# "물리적 제약 때문에 특정 노드에만 있어야 한다"). 마스터는 기본적으로 일반 파드가 못 올라가게
# 막혀있어서(control-plane taint) toleration이 필요하다. 보안그룹의 80번 포트는 예전 MetalLB용으로
# 이미 열려있어서(terraform/modules/chaos-cluster/network.tf) 추가로 열 필요는 없었다.
controller:
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30444
  hostPort:
    enabled: true
    ports:
      http: 80
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
