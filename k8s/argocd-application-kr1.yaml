# k8s/argocd-application.yaml(KR2)의 KR1 전용 사본. 컨트롤 플레인 이중화(각 리전이 독립된
# Jenkins/ArgoCD/모니터링 스택을 갖게 됨, docs/PROJECT_LOG.md 참고)의 일환으로 KR1에도 설치한다.
#
# 최초 적용 때는 syncPolicy.automated 없이 적용 → `argocd app sync chaos-demo`로 수동
# 동기화하고 diff를 눈으로 확인(KR1의 실제 라이브 상태와 tracking-id 라벨 추가 외엔 차이 없음을
# 확인함) → 문제없어서 아래처럼 automated(prune+selfHeal)를 patch로 추가해 KR2와 동일한 자동
# 모드로 전환 완료.
#
# 적용 방법: kubectl apply -f k8s/argocd-application-kr1.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/wonju90/ChaosArena-manifests.git
    targetRevision: main
    path: argocd-managed-kr1

  destination:
    # ArgoCD가 설치된 클러스터 자기 자신(KR1)을 가리키는 특수 값 — 별도 kubeconfig 등록 불필요.
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true # Git에서 리소스가 삭제되면 클러스터에서도 삭제
      selfHeal: true # 누가 kubectl로 클러스터를 직접 바꿔도 Git 상태로 자동 되돌림
    syncOptions:
      - CreateNamespace=false # default 네임스페이스는 이미 존재
