# -----------------------------------------------------------------------------
# k8s/jenkins-pv.yaml과 완전히 같은 이유, 같은 방식이다: KR2 클러스터엔 StorageClass(자동
# 디스크 프로비저닝)가 없어서(bare-metal kubeadm, CSI 드라이버 미설치), 워커 노드 1대의
# 로컬 디렉터리를 hostPath로 직접 지정하는 수동 PV를 만든다.
#
# 왜 Jenkins와 "다른" 워커 노드에 두는가: chaosarena-worker1-kr2는 이미 Jenkins의 hostPath
# PV가 물고 있다. Redis까지 같은 노드에 두면 단일 노드에 두 개의(각각 단일 인스턴스인) 상태
# 저장 컴포넌트가 몰리게 되어, 그 노드 하나가 죽으면 Jenkins와 Redis가 동시에 죽는다. 워커가
# 3대이므로 다른 노드에 분산해 이 위험을 줄인다.
#
# 주의: hostPath는 그 노드의 로컬 디스크만 가리키므로, Redis StatefulSet도
# nodeSelector(kubernetes.io/hostname)로 반드시 같은 노드에 고정해야 한다(k8s/redis.yaml 참고).
#
# 사전 준비 (적용 전에 아래 노드에서 1회 실행):
#   sudo mkdir -p /data/redis && sudo chown 999:999 /data/redis
#   (999는 공식 redis:7-alpine 이미지 컨테이너의 기본 실행 UID/GID - 다른 태그를 쓴다면
#    `docker run --rm redis:<태그> id redis`로 실제 UID를 먼저 확인할 것)
#
# 아래 노드 이름(chaosarena-worker2-kr2)은 예시다 - 적용 직전 `kubectl get nodes`로 실제
# 존재하는 워커 노드 이름을 확인하고 필요하면 바꿀 것.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: redis-local
  hostPath:
    path: /data/redis
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - chaosarena-worker2-kr2
