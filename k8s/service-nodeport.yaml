# MetalLB의 L2(ARP) 모드가 NHN Cloud 가상 네트워크에서 막혀 EXTERNAL-IP를 못 받을 경우의
# 폴백. 워커 아무 노드의 Public IP:30080 으로 접속하면 된다.
apiVersion: v1
kind: Service
metadata:
  name: chaos-demo-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: chaos-demo
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
