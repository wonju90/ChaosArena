# ---------------------------------------------------------------------------
# kube-prometheus-stack Helm 릴리즈에 Slack 알림 설정을 추가하는 values 파일.
# 앱(app.py)이 쓰던 것과 동일한 k8s Secret(slack-webhook)을 재사용한다 — Webhook
# URL을 여기에 평문으로 다시 적지 않기 위해, Alertmanager 파드에 그 Secret을
# 파일로 마운트해서 읽게 한다(api_url_file).
#
# 적용 방법: --reuse-values는 -f 파일을 무시하는 함정이 있으므로 쓰지 않는다.
# 대신 최초 설치 때 준 --set 값(NodePort 등)을 모두 다시 명시하고 이 파일을 -f로 합친다.
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --set grafana.service.type=NodePort --set grafana.service.nodePort=30030 \
#     --set prometheus.service.type=NodePort --set prometheus.service.nodePorts.http=30090 \
#     -f k8s/alertmanager-slack-values.yaml
# ---------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    # slack-webhook Secret을 /etc/alertmanager/secrets/slack-webhook/ 아래에 마운트
    secrets:
      - slack-webhook

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      # kube-prometheus-stack 기본 route가 내부 Watchdog 하트비트 알림을
      # receiver "null"로 무음 처리하는데, 우리가 receivers 리스트를 통째로
      # 덮어쓰면 그 이름이 사라져 Operator가 "undefined receiver null" 에러로
      # reconcile 자체를 실패시킨다. 그래서 이 서브라우트를 그대로 유지한다.
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/url
            channel: "#chaosarena-전체"
            send_resolved: true
            title: "{{ .CommonLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
