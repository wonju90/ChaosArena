# MetalLB가 정상 동작할 때 사용하는 Service. EXTERNAL-IP가 <pending>으로 안 바뀌면
# service-nodeport.yaml로 폴백할 것 (05-install-metallb.sh 참고).
apiVersion: v1
kind: Service
metadata:
  name: chaos-demo-lb
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: chaos-demo
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
