# 사용법:
#   1) 이 파일을 redis-secret.yaml로 복사
#   2) password 값을 실제로 쓸 비밀번호로 교체(랜덤 문자열 권장: openssl rand -base64 24)
#   3) kubectl apply -f k8s/redis-secret.yaml
# redis-secret.yaml은 .gitignore에 등록되어 있어 실수로 커밋되지 않는다.
# k8s/deployment.yaml의 REDIS_PASSWORD도 이 Secret의 같은 key를 읽는다.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: default
type: Opaque
stringData:
  password: "REPLACE_ME_WITH_A_REAL_RANDOM_PASSWORD"
